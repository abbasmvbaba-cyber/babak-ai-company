    <path d="M57 43h29c18 0 29 9 29 22 0 10-6 17-17 20 14 2 23 10 23 23 0 17-14 28-35 28H57" stroke-width="11"/>
    <path d="M64 85h23" stroke-width="8"/>
  </g>
  <g fill="#39e7d4" stroke="#07101f" stroke-width="4">
    <circle cx="128" cy="36" r="7"/><circle cx="136" cy="75" r="7"/><circle cx="127" cy="122" r="7"/>
  </g>
  <g stroke="#39e7d4" stroke-width="3" opacity=".9"><path d="M119 36h-10"/><path d="M127 75h-14"/><path d="M118 122h-11"/></g>
