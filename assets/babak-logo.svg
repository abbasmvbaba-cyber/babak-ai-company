<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-labelledby="title desc">
  <title id="title">Babak AI Company logo</title>
  <desc id="desc">A geometric B symbol combined with an artificial intelligence circuit mark</desc>
  <defs>
    <linearGradient id="bg" x1="16" y1="12" x2="145" y2="150" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7c5cff"/>
      <stop offset="0.48" stop-color="#39e7d4"/>
      <stop offset="1" stop-color="#162a4d"/>
    </linearGradient>
    <linearGradient id="mark" x1="56" y1="34" x2="112" y2="126" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ccfdfa"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="5" y="5" width="150" height="150" rx="42" fill="#07101f" stroke="#2c456b" stroke-width="3"/>
